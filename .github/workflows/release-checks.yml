name: Release checks

on:
  push:
  pull_request:

jobs:
  wordpress-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        wp-version: ['6.8.3', 'latest']
    env:
      DPT_WP_VERSION: ${{ matrix.wp-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find daily-prayer-time.php uninstall.php API Models Views vendor -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check advertised PHP 8.2 compatibility
        run: >-
          docker run --rm --platform linux/amd64 -v "$PWD:/plugin:ro" -w /plugin
          php:8.2-cli sh -c "find daily-prayer-time.php uninstall.php API Models Views vendor -name '*.php' -print0 | xargs -0 -n1 php -l"
      - name: Check bundled dependencies
        run: test -f vendor/autoload.php && test -f vendor/islamic-network/prayer-times/src/PrayerTimes/PrayerTimes.php
      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction
      - name: Run WordPress regression suite
        run: bash tests/run.sh
